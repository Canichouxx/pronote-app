name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Clé de signature fixe (pour mettre à jour sans désinstaller)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "fingerprint"

      - name: Numéro de version qui augmente à chaque build
        run: |
          BUILD=${{ github.run_number }}
          sed -i '/^version = /d; /^android.numeric_version/d' buildozer.spec
          sed -i "/^\[app\]/a android.numeric_version = $((20000 + BUILD))" buildozer.spec
          sed -i "/^\[app\]/a version = 0.1.$BUILD" buildozer.spec
          grep -n -E "^(version|android.numeric_version)" buildozer.spec

      - name: Installer Buildozer
        run: pip install --upgrade buildozer "cython==0.29.36" virtualenv

      - name: Build APK
        run: buildozer -v android debug

      - name: Signer l'APK avec la clé fixe
        run: |
          AP=$(find ~/.buildozer -name apksigner -type f | head -1)
          SRC=$(ls bin/*.apk | head -1)
          "$AP" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out bin/pronote.apk "$SRC"
          GOT=$("$AP" verify --print-certs bin/pronote.apk | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr -d ' ')
          WANT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "::notice title=Signature APK::$GOT"
          echo "::notice title=Version APK::0.1.${{ github.run_number }} (versionCode $((20000 + ${{ github.run_number }})))"
          if [ "$GOT" != "$WANT" ]; then echo "::error::La signature ne correspond pas à la clé fixe ($GOT / $WANT)"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pronote-apk
          path: bin/pronote.apk
